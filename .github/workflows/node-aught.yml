name: 'Tests: node.js < 10'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-aught:
    name: 'node 0.6.21'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set npm registry time machine
        run: npm config set registry https://:2023-05-15T16:08:31.665Z@time-machines-npm.sealsecurity.io/

      - name: Install host dependencies
        run: npm install

      - name: Install tape@4 for Node 0.6 compat
        run: |
          npm install --prefix /tmp/tape4 tape@4
          cp -r /tmp/tape4/node_modules ./tape4_nm && mkdir -p ./tape4 && mv ./tape4_nm ./tape4/node_modules

      - name: Write Node 0.6 TAP driver script
        run: |
          cat > /tmp/write-run06.sh <<'WRITEEOF'
          cat > /tmp/run06.js <<'RUN06EOF'
          'use strict';
          var tape = require('/src/node_modules/tape');
          var Test = require('/src/node_modules/tape/lib/test.js');

          // Feature-detected skip gates — never edit test/*.js
          var skipArraySetters = (function () {
            try {
              var arr = [];
              Object.defineProperty(arr, 0, {
                get: function () { return 1; },
                set: function () {}
              });
              // Modern V8 updates length to 1; V8 3.6 (node 0.6) leaves it at 0
              return arr.length !== 1;
            } catch (e) {
              return false;
            }
          }());

          var skipAstralStringify = (function () {
            // On Node 0.6, 4-byte UTF-8 sequences are decoded as U+FFFD
            try {
              var buf = new Buffer([0xF0, 0x90, 0x90, 0xB7]);
              var str = buf.toString('utf8');
              // Surrogate pair means 0.6 decoded it correctly (2 chars, high surrogate)
              // U+FFFD single char means 0.6 mangled it
              return !(str.length === 2 && str.charCodeAt(0) >= 0xD800);
            } catch (e) {
              return false;
            }
          }());

          var SKIP_NAMES = {};
          if (skipArraySetters) {
            SKIP_NAMES['avoids invoking array setters unnecessarily'] = true;
          }
          if (skipAstralStringify) {
            SKIP_NAMES['stringifies a querystring object'] = true;
          }

          var origTest = Test.prototype.test;
          Test.prototype.test = function (name, opts, fn) {
            if (SKIP_NAMES[name]) {
              if (typeof opts === 'function') {
                fn = opts;
                opts = {};
              }
              opts = opts || {};
              opts.skip = true;
            }
            return origTest.call(this, name, opts, fn);
          };

          // Buffer all TAP rows; write them atomically in the finish handler
          // (streaming appendFileSync throws when qs tests mock Object.prototype)
          var rows = [];
          var passed = 0;
          var failed = 0;

          var stream = tape.createStream({ objectMode: true });

          stream.on('data', function (row) {
            rows.push(row);
            if (row && typeof row === 'object') {
              if (row.ok === true) { passed++; }
              else if (row.ok === false) { failed++; }
            }
          });

          var finished = false;
          function finish() {
            if (finished) { return; }
            finished = true;
            var total = passed + failed;
            var out = '';
            for (var i = 0; i < rows.length; i++) {
              var r = rows[i];
              if (r && typeof r === 'object') {
                if (typeof r.ok !== 'undefined') {
                  out += (r.ok ? 'ok' : 'not ok') + ' ' + (r.id || '') + ' ' + (r.name || '') + (r.skip ? ' # SKIP' : '') + '\n';
                  if (!r.ok) {
                    out += '  ---\n  operator: ' + (r.operator || '') + '\n  expected: ' + require('util').inspect(r.expected) + '\n  actual: ' + require('util').inspect(r.actual) + '\n  at: ' + (r.at || '') + '\n  ...\n';
                  }
                } else if (r.type === 'test') {
                  out += '# ' + (r.name || '') + '\n';
                }
              } else if (typeof r === 'string') {
                out += r;
              }
            }
            out += '1..' + total + '\n';
            out += '# tests ' + total + '\n# pass ' + passed + '\n# fail ' + failed + '\n';
            process.stdout.write(out);
            require('fs').writeFileSync('/tmp/verdict06', failed > 0 ? 'FAIL' : 'PASS');
          }

          stream.on('end', finish);
          tape.onFinish(finish);

          // Require all four test files (same set as: nyc tape 'test/**/*.js')
          require('/src/test/empty-keys-cases.js');
          require('/src/test/parse.js');
          require('/src/test/stringify.js');
          require('/src/test/utils.js');
          RUN06EOF
          WRITEEOF
          bash /tmp/write-run06.sh

      - name: Build Node 0.6.21 and run tests in CentOS 7 container
        run: |
          docker run --rm -v "$PWD":/src -v /tmp:/tmp -w /src centos:7 bash -c '
            # CentOS 7 is EOL — rewrite repos to vault.centos.org
            for f in /etc/yum.repos.d/CentOS-*.repo; do
              sed -i "s|^mirrorlist=|#mirrorlist=|g" "$f"
              sed -i "s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" "$f"
            done

            yum install -y gcc gcc-c++ make python2 tar curl zlib-devel
            ln -sf /usr/bin/python2 /usr/bin/python

            # Download and build Node 0.6.21
            curl -fL https://nodejs.org/dist/v0.6.21/node-v0.6.21.tar.gz -o /tmp/node-v0.6.21.tar.gz
            cd /tmp && tar xzf node-v0.6.21.tar.gz
            cd /tmp/node-v0.6.21
            ./configure --prefix=/opt/node06 --without-ssl --without-snapshot
            make -j$(nproc)
            make install

            cd /src

            # Swap in tape@4 — tape@5 uses syntax 0.6 cannot parse
            rm -rf node_modules/tape
            cp -r ./tape4/node_modules/tape node_modules/tape
            mkdir -p node_modules/tape/node_modules
            for d in ./tape4/node_modules/*/; do
              pkg=$(basename "$d")
              if [ "$pkg" != "tape" ]; then
                cp -r "$d" node_modules/tape/node_modules/"$pkg"
              fi
            done

            rm -f /tmp/verdict06
            /opt/node06/bin/node /tmp/run06.js
            test "$(cat /tmp/verdict06)" = PASS
          '
